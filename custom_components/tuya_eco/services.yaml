set_dps:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: tuya_eco
    dps:
      required: true
      example: '{"1": true, "2": 500}'
      selector:
        object:

refresh_cloud:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: tuya_eco

reconnect:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: tuya_eco

set_power_on_state:
  target:
    entity:
      integration: tuya_eco
      domain: select
  fields:
    rgb_color:
      required: false
      selector:
        color_rgb:
    brightness_pct:
      required: false
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    color_temp_kelvin:
      required: false
      selector:
        color_temp:
          unit: kelvin
          min: 2700
          max: 6500
