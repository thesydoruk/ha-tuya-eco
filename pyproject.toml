[project]
name = "ha-tuya-eco"
version = "0.1.0"
description = "Modular Home Assistant integration for the Tuya ecosystem (Smart Life, Ledvance SMART+, …) with local control"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "ASYNC"]
ignore = [
  "D203", "D212", "D213", "D401", "D100", "D104", "D107",  # docstring style choices
  "RUF012", "RUF002", "RUF046", "RUF100",
  "ASYNC109", "B027",
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.tuya_eco"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
